<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汉字象形连线练习</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#f6f3ea;
    --card:#ffffff;
    --ink:#33302a;
    --sub:#8a8375;
    --line:#d8d2c2;
    --good:#3f9d6e;
    --bad:#d9665a;
    --accent:#5b7c99;
    --shadow:0 2px 10px rgba(80,70,50,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:18px 14px 40px;
  }
  header{text-align:center;margin-bottom:14px;}
  header h1{
    font-family:"Noto Serif SC",serif;
    font-size:26px;font-weight:900;letter-spacing:2px;
  }
  header p{color:var(--sub);font-size:14px;margin-top:6px;}

  .toolbar{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;
    margin-bottom:16px;font-size:13px;color:var(--sub);
  }
  .toolbar label{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none;}
  .score{
    background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:6px 14px;font-weight:500;color:var(--ink);
  }

  .board{
    position:relative;width:100%;max-width:640px;
    background:var(--card);border:1px solid var(--line);border-radius:22px;
    box-shadow:var(--shadow);padding:18px 14px;
  }
  #svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;}

  .cols{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .col{display:flex;flex-direction:column;gap:12px;}

  .card{
    position:relative;
    border:2px solid var(--line);border-radius:16px;background:#fbfaf6;
    min-height:86px;padding:10px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    cursor:pointer;transition:transform .12s ease,border-color .12s ease,background .12s ease;
    font-family:inherit;color:var(--ink);
  }
  .card:hover{transform:translateY(-2px);}
  .card.selected{border-color:var(--accent);background:#eef3f8;}
  .card.matched{border-color:var(--good);background:#eef7f1;cursor:default;}
  .card.wrong{border-color:var(--bad);background:#fbeeed;animation:shake .3s ease;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-4px);}
    75%{transform:translateX(4px);}
  }

  .pic{font-size:40px;line-height:1;}
  .hanzi{
    font-family:"Noto Serif SC",serif;font-size:38px;font-weight:700;line-height:1;
  }
  .pinyin{font-size:14px;color:var(--accent);letter-spacing:1px;}
  .vi{font-size:12.5px;color:var(--sub);}

  .hidden{display:none;}

  .footer{margin-top:18px;display:flex;gap:12px;align-items:center;}
  button.btn{
    font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;
    border:none;border-radius:18px;padding:10px 22px;
    background:var(--accent);color:#fff;box-shadow:var(--shadow);
  }
  button.btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--accent);}

  /* 完成弹窗 */
  .overlay{
    position:fixed;inset:0;background:rgba(50,45,35,.35);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:10;
  }
  .overlay.hidden{display:none;}
  .panel{
    background:#fff;border-radius:22px;padding:28px 24px;text-align:center;
    max-width:320px;width:100%;box-shadow:var(--shadow);
  }
  .panel .big{font-size:44px;margin-bottom:10px;}
  .panel h2{font-family:"Noto Serif SC",serif;font-size:22px;margin-bottom:8px;}
  .panel p{color:var(--sub);font-size:14px;margin-bottom:18px;}

  @media (max-width:420px){
    .hanzi{font-size:30px;}
    .pic{font-size:32px;}
    .card{min-height:74px;}
  }
</style>
</head>
<body>

<header>
  <h1>象形汉字 · 找朋友</h1>
  <p>左边是图画，右边是汉字，点一点把它们连起来</p>
</header>

<div class="toolbar">
  <span class="score" id="score">已答对 0 / 0</span>
  <label><input type="checkbox" id="togglePinyin" checked> 拼音</label>
  <label><input type="checkbox" id="toggleVi" checked> 越语</label>
</div>

<div class="board" id="board">
  <svg id="svg"></svg>
  <div class="cols">
    <div class="col" id="leftCol"></div>
    <div class="col" id="rightCol"></div>
  </div>
</div>

<div class="footer">
  <button class="btn ghost" id="reshuffle">换一组</button>
  <button class="btn" id="restart">重新开始</button>
</div>

<div class="overlay hidden" id="overlay">
  <div class="panel">
    <div class="big" id="emojiWin">🎉</div>
    <h2>太棒了！</h2>
    <p id="winText"></p>
    <button class="btn" id="again">再练一组</button>
  </div>
</div>

<script>
/* ===== 词库：象形入门字（图案 / 汉字 / 拼音 / 越语释义） ===== */
const WORDS = [
  { hanzi:"日", pinyin:"rì",   emoji:"☀️", vi:"mặt trời" },
  { hanzi:"月", pinyin:"yuè",  emoji:"🌙", vi:"mặt trăng" },
  { hanzi:"山", pinyin:"shān", emoji:"⛰️", vi:"núi" },
  { hanzi:"水", pinyin:"shuǐ",  emoji:"💧", vi:"nước" },
  { hanzi:"火", pinyin:"huǒ",   emoji:"🔥", vi:"lửa" },
  { hanzi:"木", pinyin:"mù",    emoji:"🌳", vi:"cây gỗ" },
  { hanzi:"人", pinyin:"rén",   emoji:"🧍", vi:"người" },
  { hanzi:"口", pinyin:"kǒu",   emoji:"👄", vi:"miệng" },
  { hanzi:"目", pinyin:"mù",    emoji:"👁️", vi:"mắt" },
  { hanzi:"耳", pinyin:"ěr",    emoji:"👂", vi:"tai" },
  { hanzi:"手", pinyin:"shǒu",  emoji:"✋", vi:"tay" },
  { hanzi:"足", pinyin:"zú",    emoji:"🦶", vi:"chân" },
];

const ROUND_SIZE = 6;
let round = [];
let matched = new Set();
let selected = null;      // { side:'left'|'right', hanzi }
let wrongCount = 0;
let doneCount = 0;

const leftCol = document.getElementById("leftCol");
const rightCol = document.getElementById("rightCol");
const svg = document.getElementById("svg");
const board = document.getElementById("board");
const scoreEl = document.getElementById("score");
const overlay = document.getElementById("overlay");
const winText = document.getElementById("winText");

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function pickRound(){
  round = shuffle(WORDS).slice(0, ROUND_SIZE);
  matched = new Set();
  selected = null;
  wrongCount = 0;
  doneCount = 0;
  updateScore();
  render();
}

function render(){
  leftCol.innerHTML = "";
  rightCol.innerHTML = "";
  svg.innerHTML = "";

  const showPinyin = document.getElementById("togglePinyin").checked;
  const showVi = document.getElementById("toggleVi").checked;

  shuffle(round).forEach(w=>{
    const card = document.createElement("button");
    card.className = "card left";
    card.dataset.hanzi = w.hanzi;
    card.innerHTML = `
      <div class="pic">${w.emoji}</div>
      <div class="vi ${showVi?"":"hidden"}">${w.vi}</div>`;
    card.addEventListener("click", ()=>onPick("left", w.hanzi, card));
    leftCol.appendChild(card);
  });

  shuffle(round).forEach(w=>{
    const card = document.createElement("button");
    card.className = "card right";
    card.dataset.hanzi = w.hanzi;
    card.innerHTML = `
      <div class="hanzi">${w.hanzi}</div>
      <div class="pinyin ${showPinyin?"":"hidden"}">${w.pinyin}</div>`;
    card.addEventListener("click", ()=>onPick("right", w.hanzi, card));
    rightCol.appendChild(card);
  });
}

function onPick(side, hanzi, card){
  if(matched.has(hanzi)) return;

  if(selected && selected.side !== side){
    // 尝试配对
    if(selected.hanzi === hanzi){
      const otherCard = selected.card;
      matched.add(hanzi);
      doneCount++;
      card.classList.add("matched");
      otherCard.classList.add("matched");
      drawLine(otherCard, card, "var(--good)");
      selected = null;
      updateScore();
      if(doneCount === round.length) setTimeout(showWin, 350);
    }else{
      wrongCount++;
      card.classList.add("wrong");
      selected.card.classList.add("wrong");
      const s = selected;
      setTimeout(()=>{
        card.classList.remove("wrong");
        s.card.classList.remove("wrong");
      }, 350);
      selected = null;
      updateScore();
    }
    return;
  }

  // 选中 / 切换选中
  if(selected) selected.card.classList.remove("selected");
  if(selected && selected.hanzi === hanzi && selected.side === side){
    selected = null;
  }else{
    selected = { side, hanzi, card };
    card.classList.add("selected");
  }
}

function drawLine(a, b, color){
  const boardRect = board.getBoundingClientRect();
  const r1 = a.getBoundingClientRect();
  const r2 = b.getBoundingClientRect();
  const x1 = r1.right - boardRect.left;
  const y1 = r1.top + r1.height/2 - boardRect.top;
  const x2 = r2.left - boardRect.left;
  const y2 = r2.top + r2.height/2 - boardRect.top;

  const line = document.createElementNS("http://www.w3.org/2000/svg","line");
  line.setAttribute("x1", x1); line.setAttribute("y1", y1);
  line.setAttribute("x2", x2); line.setAttribute("y2", y2);
  line.setAttribute("stroke", color);
  line.setAttribute("stroke-width", "3");
  line.setAttribute("stroke-linecap", "round");
  svg.appendChild(line);
}

function updateScore(){
  scoreEl.textContent = `已答对 ${doneCount} / ${round.length}，错误 ${wrongCount} 次`;
}

function showWin(){
  const accuracy = doneCount + wrongCount === 0 ? 100 :
    Math.round(doneCount/(doneCount+wrongCount)*100);
  winText.textContent = `你连对了全部 ${doneCount} 个字，正确率 ${accuracy}%。`;
  overlay.classList.remove("hidden");
}

document.getElementById("reshuffle").addEventListener("click", pickRound);
document.getElementById("restart").addEventListener("click", ()=>{ overlay.classList.add("hidden"); pickRound(); });
document.getElementById("again").addEventListener("click", ()=>{ overlay.classList.add("hidden"); pickRound(); });
document.getElementById("togglePinyin").addEventListener("change", render);
document.getElementById("toggleVi").addEventListener("change", render);

window.addEventListener("resize", ()=>{
  // 重绘已完成的连线
  svg.innerHTML = "";
  matched.forEach(h=>{
    const l = leftCol.querySelector(`[data-hanzi="${h}"]`);
    const r = rightCol.querySelector(`[data-hanzi="${h}"]`);
    if(l && r) drawLine(l, r, "var(--good)");
  });
});

pickRound();
</script>
</body>
</html>
